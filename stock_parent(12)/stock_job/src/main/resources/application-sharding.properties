#1.配置数据源# 真实数据源名称，多个数据源用逗号区分spring.shardingsphere.datasource.names= defdb,ds-2023,ds-2024,ds-2025# <actual-data-source-name> 表示真实数据源名称# 数据库连接池全类名 springBoot自带的连接 5版本之后使用spring.shardingsphere.datasource.defdb.type=com.zaxxer.hikari.HikariDataSource# 数据库驱动类名，以数据库连接池自身配置为准spring.shardingsphere.datasource.defdb.driver-class-name=com.mysql.cj.jdbc.Driver# 数据库 URL 连接，以数据库连接池自身配置为准spring.shardingsphere.datasource.defdb.jdbc-url=jdbc:mysql://192.168.169.129:3306/stock_sys_db?serverTimezone=Asia/Shanghai&useSSL=false# 数据库用户名，以数据库连接池自身配置为准spring.shardingsphere.datasource.defdb.username=root# 数据库密码，以数据库连接池自身配置为准spring.shardingsphere.datasource.defdb.password=rootspring.shardingsphere.datasource.ds-2023.type=com.zaxxer.hikari.HikariDataSourcespring.shardingsphere.datasource.ds-2023.driver-class-name=com.mysql.cj.jdbc.Driverspring.shardingsphere.datasource.ds-2023.jdbc-url=jdbc:mysql://192.168.169.129:3306/stock_db_2023?serverTimezone=Asia/Shanghai&useSSL=falsespring.shardingsphere.datasource.ds-2023.username=rootspring.shardingsphere.datasource.ds-2023.password=rootspring.shardingsphere.datasource.ds-2024.type=com.zaxxer.hikari.HikariDataSourcespring.shardingsphere.datasource.ds-2024.driver-class-name=com.mysql.cj.jdbc.Driverspring.shardingsphere.datasource.ds-2024.jdbc-url=jdbc:mysql://192.168.169.129:3306/stock_db_2024?serverTimezone=Asia/Shanghai&useSSL=falsespring.shardingsphere.datasource.ds-2024.username=rootspring.shardingsphere.datasource.ds-2024.password=rootspring.shardingsphere.datasource.ds-2025.type=com.zaxxer.hikari.HikariDataSourcespring.shardingsphere.datasource.ds-2025.driver-class-name=com.mysql.cj.jdbc.Driverspring.shardingsphere.datasource.ds-2025.jdbc-url=jdbc:mysql://192.168.169.129:3306/stock_db_2025?serverTimezone=Asia/Shanghai&useSSL=falsespring.shardingsphere.datasource.ds-2025.username=rootspring.shardingsphere.datasource.ds-2025.password=root#2.配置指定表的数据节点(指定操作的逻辑表属于那个库的那个表) t_order---->t_order_1  t_order_2# 由数据源名 + 表名组成，以小数点分隔。多个表以逗号分隔，支持 inline 表达式。# 缺省表示使用已知数据源与逻辑表名称生成数据节点，用于广播表（即每个库中都需要一个同样的表用于关联查询，多为字典表）# 或只分库不分表且所有库的表结构完全一致的情况  <table-name>逻辑表spring.shardingsphere.rules.sharding.tables.stock_block_rt_info.actual-data-nodes= ds-${2023..2025}.stock_block_rt_infospring.shardingsphere.rules.sharding.tables.stock_market_index_info.actual-data-nodes= ds-${2023..2025}.stock_market_index_infospring.shardingsphere.rules.sharding.tables.stock_outer_market_index_info.actual-data-nodes= ds-${2023..2025}.stock_outer_market_index_infospring.shardingsphere.rules.sharding.tables.stock_rt_info.actual-data-nodes= ds-2023.stock_rt_info_${202301..202312},ds-2024.stock_rt_info_${202401..202412},ds-2025.stock_rt_info_${202501..202512}#3.指定库的分片策略#分片列名称spring.shardingsphere.rules.sharding.tables.stock_block_rt_info.database-strategy.standard.sharding-column=cur_time#精确分片算法名称(用于=和in操作)spring.shardingsphere.rules.sharding.tables.stock_block_rt_info.database-strategy.standard.sharding-algorithm-name=my-precise-range-db-algorithm#分片列名称spring.shardingsphere.rules.sharding.tables.stock_market_index_info.database-strategy.standard.sharding-column=cur_time#定义分片算法#精确分片算法名称(用于=和in操作)spring.shardingsphere.rules.sharding.tables.stock_market_index_info.database-strategy.standard.sharding-algorithm-name=my-precise-range-db-algorithm#分片列名称spring.shardingsphere.rules.sharding.tables.stock_outer_market_index_info.database-strategy.standard.sharding-column=cur_time#定义分片算法#精确分片算法名称(用于=和in操作)spring.shardingsphere.rules.sharding.tables.stock_outer_market_index_info.database-strategy.standard.sharding-algorithm-name=my-precise-range-db-algorithm#分片列名称spring.shardingsphere.rules.sharding.tables.stock_rt_info.database-strategy.standard.sharding-column=cur_time#定义分片算法#精确分片算法名称(用于=和in操作)spring.shardingsphere.rules.sharding.tables.stock_rt_info.database-strategy.standard.sharding-algorithm-name=my-precise-range-db-algorithm#自定义分片算法spring.shardingsphere.rules.sharding.sharding-algorithms.my-precise-range-db-algorithm.type=CLASS_BASED#标准分片策略spring.shardingsphere.rules.sharding.sharding-algorithms.my-precise-range-db-algorithm.props.strategy=STANDARD#加载自定义分片策略spring.shardingsphere.rules.sharding.sharding-algorithms.my-precise-range-db-algorithm.props.algorithmClassName=com.ming.stock.sharding.Common4Db#4.指定表的分片策略(根据分片条件找到对应的真实表)#分片列名称spring.shardingsphere.rules.sharding.tables.stock_rt_info.table-strategy.standard.sharding-column=cur_time#定义分片算法#精确分片算法名称(用于=和in操作)spring.shardingsphere.rules.sharding.tables.stock_rt_info.table-strategy.standard.sharding-algorithm-name=my-precise-range-table-algorithm#自定义分片算法spring.shardingsphere.rules.sharding.sharding-algorithms.my-precise-range-table-algorithm.type=CLASS_BASED#标准分片策略spring.shardingsphere.rules.sharding.sharding-algorithms.my-precise-range-table-algorithm.props.strategy=STANDARD#加载自定义分片策略spring.shardingsphere.rules.sharding.sharding-algorithms.my-precise-range-table-algorithm.props.algorithmClassName=com.ming.stock.sharding.Common4Tb#5.其他#5.1 默认数据库分片策略(对于不做分片处理的操作 都会直接访问默认数据源)spring.shardingsphere.rules.sharding.default-data-source-name=defdb#5.2是否开sql显示 默认为falsespring.shardingsphere.props.sql-show=true#5.3配种广播表# 广播表规则列表  指定t_dict为公共表 多个公共表以逗号间隔spring.shardingsphere.rules.sharding.broadcast-tables=stock_business